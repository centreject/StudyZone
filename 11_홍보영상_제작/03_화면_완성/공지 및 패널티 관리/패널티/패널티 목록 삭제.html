        body {

            background-color: #2b2b2b; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0;
        }
        .app-container {
            width: 402px; 
            height: 874px; 
            background-color: #F8F9FA; 
            display: flex; 
            flex-direction: column;
            position: relative; 
            box-shadow: 0 0 50px rgba(0,0,0,0.5); 
            border-radius: 30px; 
            overflow: hidden;
        }
        .bottom-nav-item {
            color: #545454; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 6px; 
            font-size: 11px; 
            height: 100%; 
            width: 25%; 
            cursor: pointer;
        }
        .bottom-nav-item.active { 
            color: #007BFF; 
            font-weight: 600; 
        }
        ::placeholder { color: #CCCCCC; }
