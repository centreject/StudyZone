<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스터디존 관리자 - 공지사항 (선택 모드)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 기존 스타일 유지 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; background-color: #2b2b2b; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .app-container { width: 402px; height: 874px; background-color: #F8F9FA; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.5); border-radius: 30px; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .bottom-nav-item { color: #545454; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11px; height: 100%; width: 25%; cursor: pointer; transition: color 0.2s; }
        .bottom-nav-item.active { color: #007BFF; font-weight: 600; }
        
        /* 체크박스 커스텀 스타일 (참조 파일에서 가져옴) */
        .custom-checkbox { appearance: none; width: 18px; height: 18px; border: 2px solid #ddd; border-radius: 4px; cursor: pointer; position: relative; }
        .custom-checkbox:checked { background-color: #007BFF; border-color: #007BFF; }
        .custom-checkbox:checked::after { content: '✔'; font-size: 12px; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="h-[60px] px-5 flex items-center justify-between bg-white border-b border-gray-100 shrink-0 z-10">
            <h1 class="text-lg font-bold text-[#007BFF]">스터디존 - 관리자</h1>
            <div class="flex items-center gap-4">
                <button class="text-gray-500 hover:text-[#007BFF]"><i class="fa-regular fa-bell text-xl"></i></button>
                <button class="text-gray-500 hover:text-[#007BFF]"><i class="fa-solid fa-bars text-xl"></i></button>
            </div>
        </header>

        <div class="h-[50px] px-4 flex items-center gap-3 bg-[#F8F9FA] shrink-0">
            <button class="text-gray-600"><i class="fa-solid fa-arrow-left text-lg"></i></button>
            <span class="text-lg font-medium text-[#333]">공지사항</span>
        </div>

        <div class="px-4 pb-2 bg-[#F8F9FA] shrink-0">
            <div class="flex gap-2 mb-3">
                <div class="flex-1 h-[40px] bg-white border border-gray-200 rounded-lg flex items-center px-3 gap-2">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
                    <input type="text" placeholder="공지 이름으로 검색 ..." class="flex-1 bg-transparent text-sm outline-none text-[#333]">
                </div>
                <div class="w-[80px] h-[40px] bg-white border border-gray-200 rounded-lg flex items-center justify-between px-3 cursor-pointer">
                    <span class="text-xs text-gray-500">전체</span>   <i class="fa-solid fa-chevron-down text-gray-400 text-xs"></i>
                </div>
            </div>
            
            <div class="flex justify-end gap-2 mb-2">
                <button class="px-3 py-1.5 bg-white border border-gray-200 rounded text-xs text-gray-500 font-medium hover:bg-gray-50">등록</button>
                <button class="px-3 py-1.5 bg-white border border-gray-200 rounded text-xs text-red-500 font-medium hover:bg-red-50 border-red-100">삭제</button>
            </div>
        </div>

     <main class="flex-1 overflow-y-auto no-scrollbar bg-[#F8F9FA] px-4 pb-4">
            <div class="flex items-center py-2 border-b border-gray-200 text-xs font-bold text-[#007BFF] mb-2">
                <div class="w-[30px] text-center"></div> <div class="flex-1 pl-2">제목</div>
                <div class="w-[70px] text-center">작성일</div>
                <div class="w-[50px] text-center">상태</div>
            </div>


            <div class="flex items-center py-3 border-b border-gray-100 bg-white rounded-lg mb-2 shadow-sm px-2">
                <div class="w-[30px] flex justify-center">
                    <input type="checkbox" class="custom-checkbox" checked>
                </div>
                <div class="flex-1 pl-2 pr-2 truncate">
                    <div class="text-[13px] text-[#333] truncate font-medium">[공지] 시스템 점검 안내</div>
                </div>
                <div class="w-[70px] text-center text-[11px] text-gray-500">2025. 11. 8</div>
                <div class="w-[50px] text-center text-[11px] text-[#007BFF] font-medium">공개</div>
            </div>

            <div class="flex items-center py-3 border-b border-gray-100 bg-white rounded-lg mb-2 shadow-sm px-2">
                <div class="w-[30px] flex justify-center">
                    <input type="checkbox" class="custom-checkbox" checked>
                </div>
                <div class="flex-1 pl-2 pr-2 truncate">
                    <div class="text-[13px] text-[#333] truncate font-medium">[공지] 센서 오류 해결 완료 및...</div>
                </div>
                <div class="w-[70px] text-center text-[11px] text-gray-500">2025. 11. 8</div>
                <div class="w-[50px] text-center text-[11px] text-gray-400 font-medium">비공개</div>
            </div>
             <div class="flex items-center py-3 border-b border-gray-100 bg-white rounded-lg mb-2 shadow-sm px-2">
                <div class="w-[30px] flex justify-center">
                    <input type="checkbox" class="custom-checkbox">
                </div>
                <div class="flex-1 pl-2 pr-2 truncate">
                    <div class="text-[13px] text-[#333] truncate font-medium">[공지] 시스템 점검 안내</div>
                </div>
                <div class="w-[70px] text-center text-[11px] text-gray-500">2025. 11. 8</div>
                <div class="w-[50px] text-center text-[11px] text-[#007BFF] font-medium">공개</div>
            </div>
        </main>

    <nav class="h-[85px] border-t border-gray-100 flex justify-between items-center px-2 bg-white pb-3 shrink-0 z-10">
            <button class="bottom-nav-item"><i class="fa-solid fa-house text-xl"></i><span>홈</span></button>
            <button class="bottom-nav-item"><i class="fa-regular fa-calendar text-xl"></i><span>좌석 관리</span></button>
            <button class="bottom-nav-item active"><i class="fa-solid fa-bullhorn text-xl"></i><span>공지사항 관리</span></button>
            <button class="bottom-nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="mb-0.5">
                    <path d="M7.86 2H16.14L22 7.86V16.14L16.14 22H7.86L2 16.14V7.86L7.86 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M12 8V12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M12 16H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span>신고 관리</span>
            </button>
        </nav>
    </div>
    </div>
</body>
</html>
